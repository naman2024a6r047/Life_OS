<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Badge -->
  <rect width="100" height="100" rx="28" fill="#090A0F" />
  <rect x="2" y="2" width="96" height="96" rx="26" fill="none" stroke="url(#grad)" stroke-width="2.5" opacity="0.6" />

  <!-- Target Ring Accent -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="url(#grad)" stroke-width="4" stroke-dasharray="8 4" opacity="0.4" />

  <!-- LifeOS 'L' Shield Bolt Logo -->
  <path d="M 36 26 L 36 70 L 68 70 L 68 58 L 48 58 L 48 26 Z" fill="url(#grad)" filter="url(#glow)" />
  
  <!-- Glowing Center Pulse Dot -->
  <circle cx="68" cy="32" r="6" fill="#F43F5E" />
</svg>
